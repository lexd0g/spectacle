name: Build Fedora RPM

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y install --skip-unavailable \
            git \
            cmake \
            gcc-c++ \
            ninja-build \
            rpm-build \
            rpmdevtools \
            dnf-plugins-core \
            extra-cmake-modules \
            qt6-qtbase-devel \
            qt6-qtbase-private-devel \
            qt6-qtdeclarative-devel \
            qt6-qtwayland-devel \
            qt6-qtmultimedia-devel \
            qt6-qtsvg-devel \
            kquickimageeditor-qt6-devel \
            kpipewire-devel \
            layer-shell-qt-devel \
            plasma-wayland-protocols-devel \
            kf6-kcoreaddons-devel \
            kf6-kconfig-devel \
            kf6-kdbusaddons-devel \
            kf6-knotifications-devel \
            kf6-ki18n-devel \
            kf6-kio-devel \
            kf6-kwindowsystem-devel \
            kf6-kglobalaccel-devel \
            kf6-kxmlgui-devel \
            kf6-kguiaddons-devel \
            kf6-kirigami-devel \
            kf6-kstatusnotifieritem-devel \
            kf6-prison-devel \
            kf6-kcrash-devel \
            kf6-kdoctools-devel \
            wayland-devel \
            wayland-protocols-devel \
            tesseract-devel \
            pipewire-devel \
            libxcb-devel \
            xcb-util-cursor-devel \
            xcb-util-image-devel
          dnf builddep -y --enablerepo='*source*' spectacle || dnf builddep -y spectacle || true

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF

      - name: Build Spectacle
        run: |
          cmake --build build --parallel

      - name: Package RPM and Archive
        run: |
          cd build
          cpack -G RPM
          cpack -G TGZ

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectacle-fedora-rpm
          path: |
            build/*.rpm
            build/*.tar.gz

  release:
    needs: build-rpm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: spectacle-fedora-rpm
          path: release-files

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-fedora45
          name: "Spectacle with Smart Eraser (Fedora 45)"
          body: |
            ### Spectacle with Smart Eraser

            This release includes **Spectacle** with the new **Smart Eraser** editing tool, built natively for **Fedora 45 / Rawhide** (x86_64).

            #### Features:
            - **Smart Eraser**: Shares behavior with ShareX's Smart Eraser. When you click and drag, it instantly samples the pixel color under the cursor, and draws a solid rectangle with that exact fill color and 0 stroke.
            - Preserves your existing Rectangle tool color, stroke width, and fill opacity preferences when switching between tools.

            #### Installation on Fedora 45:
            You can install it directly with `dnf`:
            ```bash
            sudo dnf install https://github.com/lexd0g/spectacle-smart-eraser/releases/download/v1.0.0-fedora45/spectacle-6.8.80-Linux.rpm
            ```
            Or download the `.tar.gz` archive to extract and run standalone.
          files: |
            release-files/*.rpm
            release-files/*.tar.gz
